# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install clang-format==23.1.1
      - run: python3 scripts/format-code.py --check
  documentation:
    name: bilingual documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-docs
  host-tests:
    name: host tests (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Fetch the pinned mbedTLS
        run: ./scripts/fetch-mbedtls.sh
      - name: Build and run the host suite
        run: make -j"$(nproc)" check
